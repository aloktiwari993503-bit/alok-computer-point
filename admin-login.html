<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Hello Computer Point</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Poppins', sans-serif; background-color: #f3f4f6; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; } </style>
</head>
<body>
    <div class="max-w-md w-full bg-white p-8 rounded-xl shadow-lg">
        <h2 class="text-2xl font-bold text-center text-blue-600 mb-6">एडमिन लॉगिन</h2>
        
        <div id="msg" class="mb-4 text-center text-sm font-semibold text-red-500"></div>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">पासवर्ड डालें</label>
                <input type="password" id="passwordInput" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="अपना पासवर्ड दर्ज करें">
            </div>
            <button onclick="doLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg transition">
                लॉगिन करें
            </button>
        </div>

        <div class="text-center mt-6">
            <a href="/" class="text-blue-500 hover:underline text-sm">← होम वेबसाइट पर जाएं</a>
        </div>
    </div>

    <script>
        function doLogin() {
            const pass = document.getElementById('passwordInput').value;
            const msgBox = document.getElementById('msg');
            
            // 🛑 यहाँ अपना पासवर्ड बदल सकते हैं (फिलहाल "my_secret_pass" सेट है)
            const MY_NEW_PASSWORD = "Alok@9935"; 

            if (pass === MY_NEW_PASSWORD) {
                localStorage.setItem("isAdminLoggedIn", "true");
                window.location.href = "/admin.html";
            } else {
                msgBox.innerText = "❌ गलत पासवर्ड! कृपया सही पासवर्ड डालें।";
            }
        }
    </script>
</body>
</html>
