<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard 💻 - Hello Computer Point</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f3f4f6; }
    </style>
    <script>
        // चेक करें कि एडमिन लॉग इन है या नहीं
        if (localStorage.getItem("isAdminLoggedIn") !== "true") {
            window.location.href = "admin-login.html";
        }
    </script>
</head>
<body class="p-4 md:p-8 text-gray-800">
    <div class="max-w-6xl mx-auto bg-white p-6 md:p-8 rounded-2xl shadow-xl border border-gray-100">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 border-b pb-4 gap-4">
            <h1 class="text-2xl md:text-3xl font-bold text-indigo-900 flex items-center">
                <i class="fas fa-user-shield text-indigo-600 mr-3"></i> Admin Dashboard (एडमिन पैनल)
            </h1>
            <div class="flex space-x-3">
                <button onclick="openPassModal()" class="bg-amber-100 text-amber-700 hover:bg-amber-200 px-4 py-2 rounded-lg font-medium transition flex items-center shadow-sm">
                    <i class="fas fa-key mr-2"></i> पासवर्ड बदलें
                </button>
                <button onclick="logout()" class="bg-red-100 text-red-600 hover:bg-red-200 px-4 py-2 rounded-lg font-medium transition flex items-center shadow-sm">
                    <i class="fas fa-sign-out-alt mr-2"></i> लॉगआउट
                </button>
            </div>
        </div>

        <div class="overflow-x-auto">
            <table class="min-w-full bg-white border border-gray-200 rounded-lg overflow-hidden shadow-sm">
                <thead class="bg-indigo-900 text-white">
                    <tr>
                        <th class="py-3 px-4 text-left font-semibold">🆔 ID & नाम</th>
                        <th class="py-3 px-4 text-left font-semibold">📱 संपर्क व फॉर्म विवरण</th>
                        <th class="py-3 px-4 text-left font-semibold">📄 डॉक्युमेंट्स</th>
                        <th class="py-3 px-4 text-left font-semibold">⚙️ स्टेटस (Status)</th>
                    </tr>
                </thead>
                <tbody id="adminTableBody" class="divide-y divide-gray-200">
                    <!-- डेटा यहाँ आएगा -->
                    <tr><td colspan="4" class="text-center py-8 text-indigo-600 font-semibold"><i class="fas fa-spinner fa-spin mr-2"></i> डेटा लोड हो रहा है...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- पासवर्ड बदलने का मोडल (Popup) -->
    <div id="passModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-xl max-w-md w-full shadow-2xl relative">
            <button onclick="closePassModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><i class="fas fa-times text-xl"></i></button>
            <h2 class="text-xl font-bold text-indigo-900 mb-4 flex items-center"><i class="fas fa-key mr-2 text-amber-500"></i> पासवर्ड बदलें</h2>
            <form id="changePasswordForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">पुराना पासवर्ड</label>
                    <input type="password" id="oldPass" required class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">नया पासवर्ड</label>
                    <input type="password" id="newPass" required class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded-lg transition">अपडेट करें</button>
                <div id="modalMsg" class="text-center mt-2 font-medium"></div>
            </form>
        </div>
    </div>

    <script>
        // 1. पासवर्ड मोडल खोलना/बंद करना
        function openPassModal() { document.getElementById('passModal').classList.remove('hidden'); }
        function closePassModal() { document.getElementById('passModal').classList.add('hidden'); document.getElementById('modalMsg').innerText = ''; }

        // 2. लॉगआउट
        function logout() {
            localStorage.removeItem("isAdminLoggedIn");
            window.location.href = "admin-login.html";
        }

        // 3. पासवर्ड बदलना (यहाँ लाइव URL सेट कर दिया गया है)
        document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const oldPassword = document.getElementById('oldPass').value;
            const newPassword = document.getElementById('newPass').value;
            const msg = document.getElementById('modalMsg');
            msg.innerHTML = '<i class="fas fa-spinner fa-spin"></i> अपडेट हो रहा है...';
            
            try {
                const res = await fetch('https://hello-computer-point.onrender.com/api/admin/change-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ oldPassword, newPassword })
                });
                const data = await res.json();
                if(res.ok) {
                    msg.className = "text-center mt-2 font-medium text-green-600";
                    msg.innerText = "✅ " + data.message;
                    setTimeout(closePassModal, 2000);
                } else {
                    msg.className = "text-center mt-2 font-medium text-red-600";
                    msg.innerText = "❌ " + data.error;
                }
            } catch(err) {
                msg.className = "text-center mt-2 font-medium text-red-600";
                msg.innerText = "❌ नेटवर्क एरर!";
            }
        });

        // 4. डेटा लोड करना (यहाँ लाइव URL सेट कर दिया गया है)
        async function loadApps() {
            const tbody = document.getElementById('adminTableBody');
            try {
                const res = await fetch('https://hello-computer-point.onrender.com/api/admin/applications');
                const data = await res.json();
                tbody.innerHTML = '';
                
                if(data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center py-6 text-gray-500 font-medium">अभी तक कोई आवेदन नहीं आया है।</td></tr>';
                    return;
                }
                
                // नए फॉर्म सबसे ऊपर दिखाने के लिए डेटा को उल्टा (reverse) कर रहे हैं
                data.reverse().forEach(app => {
                    // फाइल देखने का बटन बनाना
                    let filesHtml = '';
                    if(app.doc_paths && app.doc_paths.length > 0) {
                        app.doc_paths.forEach((path, index) => {
                            filesHtml += `<a href="https://hello-computer-point.onrender.com/uploads/${path}" target="_blank" class="inline-block bg-blue-100 text-blue-700 hover:bg-blue-200 px-3 py-1.5 rounded-lg text-xs font-bold mr-2 mb-2 shadow-sm transition"><i class="fas fa-eye mr-1"></i> फाइल ${index + 1}</a>`;
                        });
                    } else {
                        filesHtml = '<span class="text-xs text-gray-400 font-medium">कोई फाइल नहीं</span>';
                    }
                    
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-gray-50 transition border-b border-gray-100";
                    tr.innerHTML = `
                        <td class="py-4 px-4 align-top">
                            <div class="font-bold text-gray-900 text-base">#${app.id} - ${app.name}</div>
                            <div class="text-xs text-gray-500 mt-1"><i class="far fa-calendar-alt mr-1"></i> ${app.date || 'आज'}</div>
                        </td>
                        <td class="py-4 px-4 align-top">
                            <div class="font-bold text-indigo-700 mb-1"><i class="fas fa-phone-alt text-xs mr-1"></i> ${app.mobile}</div>
                            <div class="text-sm text-gray-700"><span class="font-semibold">फॉर्म:</span> ${app.form_type}</div>
                            <div class="text-xs text-gray-600 mt-1"><span class="font-semibold">क्वेरी:</span> ${app.query || 'N/A'}</div>
                            <div class="text-xs text-gray-600 mt-2 bg-gray-100 p-2 rounded-md border border-gray-200"><span class="font-semibold text-gray-800">विवरण:</span> ${app.description}</div>
                        </td>
                        <td class="py-4 px-4 align-top">
                            ${filesHtml}
                        </td>
                        <td class="py-4 px-4 align-top">
                            <select onchange="updateStatus(${app.id}, this.value)" class="border border-gray-300 rounded-lg p-2 text-sm font-bold outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer shadow-sm
                                ${app.status === 'Completed' ? 'bg-green-100 text-green-800' : (app.status === 'Processing' ? 'bg-blue-100 text-blue-800' : 'bg-amber-100 text-amber-800')}">
                                <option value="Pending" ${app.status === 'Pending' ? 'selected' : ''}>⏳ Pending (लंबित)</option>
                                <option value="Processing" ${app.status === 'Processing' ? 'selected' : ''}>🔄 Processing (प्रोसेसिंग में)</option>
                                <option value="Completed" ${app.status === 'Completed' ? 'selected' : ''}>✅ Completed (पूर्ण)</option>
                            </select>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch(err) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center py-6 text-red-500 font-bold">❌ सर्वर से डेटा लोड नहीं हो सका! (नेटवर्क एरर)</td></tr>';
            }
        }

        // 5. स्टेटस अपडेट करना (यहाँ लाइव URL सेट कर दिया गया है)
        async function updateStatus(id, status) {
            try {
                const res = await fetch('https://hello-computer-point.onrender.com/api/admin/status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, status })
                });
                if(res.ok) {
                    // स्टेटस बदलते ही पेज का डेटा तुरंत रिफ्रेश हो जाएगा
                    loadApps(); 
                } else {
                    alert('स्टेटस अपडेट फेल हो गया!');
                }
            } catch (err) {
                alert('सर्वर से कनेक्ट नहीं हो सका!');
            }
        }

        // पेज लोड होते ही डेटा मंगा लें
        window.onload = loadApps;
    </script>
</body>
</html>
